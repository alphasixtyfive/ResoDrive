name: Visible installer acceptance

on:
  push:
    branches: ['fix/**']
    paths: ['tests/installer-ui.ps1', '.github/workflows/installer-ui.yml']
  workflow_dispatch:

permissions:
  # GitHub hides draft releases from tokens without repository push access.
  # This job only reads their installers and never publishes or replaces assets.
  contents: write

jobs:
  installer-ui:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out acceptance tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact draft installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = [xml](Get-Content Directory.Build.props -Raw)
          $version = $project.SelectSingleNode('/Project/PropertyGroup/VersionPrefix').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version.' }
          New-Item -ItemType Directory -Path artifacts/win-x64 -Force | Out-Null
          gh release download "v$version" --dir artifacts/win-x64 --pattern "resodrive-win-x64-$version-setup.exe*" --pattern "resodrive-win-x64-$version.msi*"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the exact release installers.' }
      - name: Verify visible fresh Setup and legacy upgrade, then maintenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/installer-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -FullSetupUi
      - name: Preserve UI and installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visible-installer-evidence
          path: |
            ${{ runner.temp }}/resodrive-installer-smoke/*.json
            ${{ runner.temp }}/resodrive-installer-smoke/*.log
          if-no-files-found: ignore
