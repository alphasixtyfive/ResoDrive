name: CET image policy probe
on:
  push:
    branches: ['fix/**']
    paths:
      - tests/CetImagePolicyProbe.ps1
      - .github/workflows/cet-api-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify a narrow CET policy change preserves Windows settings
        shell: powershell
        run: ./tests/CetImagePolicyProbe.ps1 -ApplicationPath "$env:WINDIR/System32/cmd.exe"
