name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Freeze published installers for equal-version recovery checks
        if: github.ref_name == 'v0.3.19'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'resodrive-same-version-baseline'
          New-Item -ItemType Directory -Path $baseline -Force | Out-Null
          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'The published same-version installer baseline is unavailable.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft) { throw 'Recovery checks require the currently published installer baseline.' }
          gh release download $env:RELEASE_TAG --dir $baseline `
            --pattern 'resodrive-win-x64-0.3.19.msi*' --pattern 'resodrive-win-x64-0.3.19-setup.exe*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not freeze the published same-version installers.' }
          foreach ($name in @('resodrive-win-x64-0.3.19.msi', 'resodrive-win-x64-0.3.19.msi.sha256',
              'resodrive-win-x64-0.3.19-setup.exe', 'resodrive-win-x64-0.3.19-setup.exe.sha256')) {
            $asset = @($release.assets | Where-Object name -EQ $name)
            if ($asset.Count -ne 1) { throw "Expected one published baseline asset: $name." }
            $hash = (Get-FileHash -LiteralPath (Join-Path $baseline $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset[0].digest -ne "sha256:$hash") { throw "Published baseline hash mismatch: $name." }
          }
          Write-Output 'Published same-version installer baseline frozen and verified.'
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = [xml](Get-Content -LiteralPath Directory.Build.props -Raw)
          $version = $project.SelectSingleNode('/Project/PropertyGroup/VersionPrefix').InnerText
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag '$env:RELEASE_TAG' does not match VersionPrefix '$version'."
          }
      - name: Build and verify release
        shell: pwsh
        run: .\build.ps1 -Configuration Release -BuildMsi $true
      - name: Verify native crash monitor with disposable processes
        shell: pwsh
        timeout-minutes: 4
        run: ./tests/native-crash-smoke.ps1 -MonitorPath artifacts/win-x64/resodrive/resodrive-launcher.exe
      - name: Preserve matching diagnostic symbols separately from release downloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resodrive-symbols-${{ github.ref_name }}-${{ github.sha }}
          path: |
            artifacts/win-x64/symbols/*
            artifacts/win-x64-compatibility/symbols/*
          retention-days: 90
          if-no-files-found: error
      - name: Verify installed application lifecycle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $recovery = @{}
          if ($env:RELEASE_TAG -eq 'v0.3.19') {
            $baseline = Join-Path $env:RUNNER_TEMP 'resodrive-same-version-baseline'
            $recovery = @{
              SameVersionBaselineMsiPath = Join-Path $baseline 'resodrive-win-x64-0.3.19.msi'
              SameVersionBaselineSetupPath = Join-Path $baseline 'resodrive-win-x64-0.3.19-setup.exe'
              CandidateMsiPath = 'artifacts/win-x64/resodrive-win-x64-0.3.19.msi'
            }
          }
          ./tests/installer-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName @recovery
      - name: Verify CET compatibility installation, update and removal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/installer-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -CompatibilityMode
      - name: Verify different-account preparation on disposable user
        shell: pwsh
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/cross-account-smoke.ps1 -NewAppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify application tests with one available CPU
        shell: pwsh
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: dotnet test tests/ResoDrive.App.Tests -c Release --no-build --no-restore
      - name: Verify populated application window and process recovery
        shell: pwsh
        run: ./tests/process-smoke.ps1 -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-smoke-logs
          path: |
            ${{ runner.temp }}/resodrive-installer-smoke/*.log
            ${{ runner.temp }}/resodrive-installer-smoke/*.json
            ${{ runner.temp }}/resodrive-installer-smoke-compatibility/*.log
            ${{ runner.temp }}/resodrive-installer-smoke-compatibility/*.json
            ${{ runner.temp }}/resodrive-cross-account-smoke/*
          if-no-files-found: ignore
      - name: Preserve release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resodrive-${{ github.ref_name }}
          path: |
            artifacts/win-x64/*.zip
            artifacts/win-x64/*.zip.sha256
            artifacts/win-x64/*.msi
            artifacts/win-x64/*.msi.sha256
            artifacts/win-x64/*.exe
            artifacts/win-x64/*.exe.sha256
            artifacts/win-x64-compatibility/*.zip
            artifacts/win-x64-compatibility/*.zip.sha256
            artifacts/win-x64-compatibility/*.msi
            artifacts/win-x64-compatibility/*.msi.sha256
          if-no-files-found: error
      - name: Stage GitHub release for desktop acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseDirectory = 'artifacts\win-x64'
          $versionedSetup = Get-ChildItem -LiteralPath $releaseDirectory -File -Filter 'resodrive-win-x64-*-setup.exe'
          if (@($versionedSetup).Count -ne 1) {
            throw "Expected one versioned setup bundle, found $(@($versionedSetup).Count)."
          }
          $stableSetup = Join-Path $releaseDirectory 'ResoDrive-Setup.exe'
          $stableChecksum = "$stableSetup.sha256"
          Copy-Item -LiteralPath $versionedSetup.FullName -Destination $stableSetup
          $hash = (Get-FileHash -LiteralPath $stableSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $stableChecksum -Value "$hash  ResoDrive-Setup.exe" -Encoding ascii
          $compatibilityDirectory = 'artifacts\win-x64-compatibility'
          $version = $env:RELEASE_TAG.Substring(1)
          $expectedAssets = @(
            "resodrive-win-x64-$version.zip",
            "resodrive-win-x64-$version.zip.sha256",
            "resodrive-win-x64-$version.msi",
            "resodrive-win-x64-$version.msi.sha256",
            "resodrive-win-x64-$version-setup.exe",
            "resodrive-win-x64-$version-setup.exe.sha256",
            'ResoDrive-Setup.exe',
            'ResoDrive-Setup.exe.sha256',
            "resodrive-win-x64-$version-compatibility.zip",
            "resodrive-win-x64-$version-compatibility.zip.sha256",
            "resodrive-win-x64-$version-compatibility.msi",
            "resodrive-win-x64-$version-compatibility.msi.sha256"
          )
          $assets = @(Get-ChildItem -LiteralPath $releaseDirectory,$compatibilityDirectory -File |
            Where-Object Name -Match '\.(zip|msi|exe)(\.sha256)?$' |
            Sort-Object Name)
          $unexpected = @($assets | Where-Object Name -CNotIn $expectedAssets)
          if ($assets.Count -ne $expectedAssets.Count -or $unexpected.Count -ne 0) {
            throw 'Expected exactly twelve release assets: two MSI/ZIP payloads and one shared Setup with its stable alias and checksums.'
          }
          foreach ($name in $expectedAssets) {
            if (@($assets | Where-Object Name -CEQ $name).Count -ne 1) {
              throw "Missing or duplicate release asset: $name."
            }
          }
          gh release create $env:RELEASE_TAG $assets.FullName `
            --draft --verify-tag --notes-file RELEASE_NOTES.md --title "ResoDrive $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
