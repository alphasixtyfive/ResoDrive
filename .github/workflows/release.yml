name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Freeze published installers for equal-version recovery checks
        if: github.ref_name == 'v0.3.19'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'resodrive-same-version-baseline'
          New-Item -ItemType Directory -Path $baseline -Force | Out-Null
          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'The published same-version installer baseline is unavailable.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft) { throw 'Recovery checks require the currently published installer baseline.' }
          gh release download $env:RELEASE_TAG --dir $baseline `
            --pattern 'resodrive-win-x64-0.3.19.msi*' --pattern 'resodrive-win-x64-0.3.19-setup.exe*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not freeze the published same-version installers.' }
          foreach ($name in @('resodrive-win-x64-0.3.19.msi', 'resodrive-win-x64-0.3.19.msi.sha256',
              'resodrive-win-x64-0.3.19-setup.exe', 'resodrive-win-x64-0.3.19-setup.exe.sha256')) {
            $asset = @($release.assets | Where-Object name -EQ $name)
            if ($asset.Count -ne 1) { throw "Expected one published baseline asset: $name." }
            $hash = (Get-FileHash -LiteralPath (Join-Path $baseline $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset[0].digest -ne "sha256:$hash") { throw "Published baseline hash mismatch: $name." }
          }
          Write-Output 'Published same-version installer baseline frozen and verified.'
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = [xml](Get-Content -LiteralPath Directory.Build.props -Raw)
          $version = $project.SelectSingleNode('/Project/PropertyGroup/VersionPrefix').InnerText
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag '$env:RELEASE_TAG' does not match VersionPrefix '$version'."
          }
      - name: Build and verify release
        shell: pwsh
        run: .\build.ps1 -Configuration Release -BuildMsi $true
      - name: Verify native CET helpers and policy transactions
        shell: pwsh
        run: |
          ./native/ResoDrive.InstallerActions/test.ps1 -ApplicationPath artifacts/win-x64/resodrive/resodrive.exe -OutputDirectory "$env:RUNNER_TEMP/resodrive-cet-native"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/CetPolicyTests.ps1 -Native
          if ($LASTEXITCODE -ne 0) { throw 'CET policy acceptance failed.' }
      - name: Verify installed application lifecycle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $recovery = @{}
          if ($env:RELEASE_TAG -eq 'v0.3.19') {
            $baseline = Join-Path $env:RUNNER_TEMP 'resodrive-same-version-baseline'
            $recovery = @{
              SameVersionBaselineMsiPath = Join-Path $baseline 'resodrive-win-x64-0.3.19.msi'
              SameVersionBaselineSetupPath = Join-Path $baseline 'resodrive-win-x64-0.3.19-setup.exe'
              CandidateMsiPath = 'artifacts/win-x64/resodrive-win-x64-0.3.19.msi'
            }
          }
          ./tests/installer-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -FullSetupUi @recovery
      - name: Verify different-account preparation on disposable user
        shell: pwsh
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/cross-account-smoke.ps1 -NewAppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify one-update directory migration and rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/directory-migration-smoke.ps1 -MsiPath (Get-ChildItem artifacts/win-x64/*.msi).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      # Consume the preserved default-root fixture before the custom-root .30
      # update test can recreate a separate legacy root during old MSI removal.
      - name: Verify recovery from incomplete user-data migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/migration-recovery-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify application tests with one available CPU
        shell: pwsh
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: dotnet test tests/ResoDrive.App.Tests -c Release --no-build --no-restore
      - name: Verify populated application window and process recovery
        shell: pwsh
        run: ./tests/process-smoke.ps1 -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify branded in-app Setup updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/setup-update-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify the actual previous public updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/setup-update-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe -UsePreviousUpdater
      - name: Verify hidden CET choice through repair and an in-app version upgrade
        shell: pwsh
        run: ./tests/cet-upgrade-acceptance.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-smoke-logs
          path: |
            ${{ runner.temp }}/resodrive-installer-smoke/*.log
            ${{ runner.temp }}/resodrive-installer-smoke/*.json
            ${{ runner.temp }}/resodrive-cross-account-smoke/*
            ${{ runner.temp }}/resodrive-directory-migration-smoke/*.log
            ${{ runner.temp }}/resodrive-directory-migration-smoke/*.json
            ${{ runner.temp }}/resodrive-setup-update-smoke/**/*.log
            ${{ runner.temp }}/resodrive-setup-update-smoke/**/*.json
            ${{ runner.temp }}/resodrive-migration-recovery-smoke/*.log
            ${{ runner.temp }}/resodrive-migration-recovery-smoke/*.json
            ${{ runner.temp }}/resodrive-cet-update-smoke/*.log
            ${{ runner.temp }}/resodrive-cet-update-smoke/*.json
          if-no-files-found: ignore
      - name: Prepare package downloads
        shell: pwsh
        run: |
          $releaseDirectory = 'artifacts\win-x64'
          $versionedSetup = Get-ChildItem -LiteralPath $releaseDirectory -File -Filter 'resodrive-win-x64-*-setup.exe'
          if (@($versionedSetup).Count -ne 1) {
            throw "Expected one versioned setup bundle, found $(@($versionedSetup).Count)."
          }
          $stableSetup = Join-Path $releaseDirectory 'ResoDrive-Setup.exe'
          $stableChecksum = "$stableSetup.sha256"
          Copy-Item -LiteralPath $versionedSetup.FullName -Destination $stableSetup
          $hash = (Get-FileHash -LiteralPath $stableSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $stableChecksum -Value "$hash  ResoDrive-Setup.exe" -Encoding ascii
          $assets = Get-ChildItem -LiteralPath $releaseDirectory -File |
            Where-Object Name -Match '\.(zip|msi|exe)(\.sha256)?$' |
            Sort-Object Name
          if ($assets.Count -ne 8) {
            throw "Expected eight release files, found $($assets.Count)."
          }
      - name: Preserve packages for desktop acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resodrive-${{ github.ref_name }}
          path: |
            artifacts/win-x64/*.zip
            artifacts/win-x64/*.zip.sha256
            artifacts/win-x64/*.msi
            artifacts/win-x64/*.msi.sha256
            artifacts/win-x64/*.exe
            artifacts/win-x64/*.exe.sha256
          if-no-files-found: error
