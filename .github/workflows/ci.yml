name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and verify packages
        shell: pwsh
        run: ./build.ps1 -Configuration Release -BuildMsi $true
      - name: Verify application tests with one available CPU
        shell: pwsh
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: dotnet test tests/ResoDrive.App.Tests -c Release --no-build --no-restore
      - name: Process smoke
        shell: pwsh
        timeout-minutes: 4
        run: >-
          ./tests/process-smoke.ps1
          -AppPath "artifacts\win-x64\resodrive\resodrive.exe"
      - name: Verify installation, upgrade and removal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/installer-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-smoke-logs
          path: ${{ runner.temp }}/resodrive-installer-smoke/*.log
          if-no-files-found: ignore
