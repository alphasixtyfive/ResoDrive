name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and verify packages
        shell: pwsh
        run: ./build.ps1 -Configuration Release -BuildMsi $true
      - name: Verify native CET helpers and policy transactions
        shell: pwsh
        run: |
          ./native/ResoDrive.InstallerActions/test.ps1 -ApplicationPath artifacts/win-x64/resodrive/resodrive.exe -OutputDirectory "$env:RUNNER_TEMP/resodrive-cet-native"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/CetPolicyTests.ps1 -Native
          if ($LASTEXITCODE -ne 0) { throw 'CET policy acceptance failed.' }
      - name: Verify application tests with one available CPU
        shell: pwsh
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: dotnet test tests/ResoDrive.App.Tests -c Release --no-build --no-restore
      - name: Process smoke
        shell: pwsh
        timeout-minutes: 4
        run: >-
          ./tests/process-smoke.ps1
          -AppPath "artifacts\win-x64\resodrive\resodrive.exe"
      - name: Verify installation, upgrade and removal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/installer-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -FullSetupUi
      - name: Verify different-account preparation on disposable user
        shell: pwsh
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/cross-account-smoke.ps1 -NewAppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify one-update directory migration and rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/directory-migration-smoke.ps1 -MsiPath (Get-ChildItem artifacts/win-x64/*.msi).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      # Recovery consumes the default-root fixture before the custom-root test
      # runs the frozen .30 uninstaller, which can recreate its old default root.
      - name: Verify recovery from incomplete user-data migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/migration-recovery-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify branded in-app Setup updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/setup-update-smoke.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Verify hidden CET choice through repair and an in-app version upgrade
        shell: pwsh
        run: ./tests/cet-upgrade-acceptance.ps1 -SetupPath (Get-ChildItem artifacts/win-x64/*-setup.exe).FullName -AppPath artifacts/win-x64/resodrive/resodrive.exe
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-smoke-logs
          path: |
            ${{ runner.temp }}/resodrive-installer-smoke/*.log
            ${{ runner.temp }}/resodrive-installer-smoke/*.json
            ${{ runner.temp }}/resodrive-cross-account-smoke/*
            ${{ runner.temp }}/resodrive-directory-migration-smoke/*.log
            ${{ runner.temp }}/resodrive-directory-migration-smoke/*.json
            ${{ runner.temp }}/resodrive-setup-update-smoke/*.log
            ${{ runner.temp }}/resodrive-setup-update-smoke/*.json
            ${{ runner.temp }}/resodrive-migration-recovery-smoke/*.log
            ${{ runner.temp }}/resodrive-migration-recovery-smoke/*.json
            ${{ runner.temp }}/resodrive-cet-update-smoke/*.log
            ${{ runner.temp }}/resodrive-cet-update-smoke/*.json
          if-no-files-found: ignore
